name: FFmpeg assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to test
        required: true
        default: 2.0.2

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.asset }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: ffmpeg
            executable: ./ffmpeg
            required_encoders: libx264,h264_nvenc,h264_vaapi,h264_qsv
            required_filters: ''
          - os: windows-2025
            asset: ffmpeg.exe
            executable: .\ffmpeg.exe
            required_encoders: libx264,h264_nvenc,h264_amf,h264_qsv
            required_filters: gfxcapture
          - os: macos-15-intel
            asset: ffmpeg-darwin-x64
            executable: ./ffmpeg-darwin-x64
            required_encoders: libx264,h264_videotoolbox
            required_filters: ''
          - os: macos-15
            asset: ffmpeg-darwin-arm64
            executable: ./ffmpeg-darwin-arm64
            required_encoders: libx264,h264_videotoolbox
            required_filters: ''

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$tag" ]; then
            tag="2.0.2"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download "${{ steps.release.outputs.tag }}" --repo "${{ github.repository }}" --pattern "${{ matrix.asset }}" --output "${{ matrix.asset }}"

      - name: Allow execution
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "${{ matrix.asset }}"

      - name: Print version
        shell: pwsh
        run: |
          & "${{ matrix.executable }}" -hide_banner -version

      - name: Verify required screen encoders
        shell: pwsh
        run: |
          $encoderOutput = (& "${{ matrix.executable }}" -hide_banner -encoders 2>&1) -join "`n"
          foreach ($encoder in "${{ matrix.required_encoders }}".Split(',')) {
            $escapedEncoder = [Regex]::Escape($encoder)
            if ($encoderOutput -notmatch "(?m)^\s*V\S*\s+$escapedEncoder\s") {
              throw "FFmpeg asset '${{ matrix.asset }}' does not provide required encoder '$encoder'."
            }
          }

      - name: Verify required screen capture filters
        if: matrix.required_filters != ''
        shell: pwsh
        run: |
          $filterOutput = (& "${{ matrix.executable }}" -hide_banner -filters 2>&1) -join "`n"
          foreach ($filter in "${{ matrix.required_filters }}".Split(',')) {
            $escapedFilter = [Regex]::Escape($filter)
            if ($filterOutput -notmatch "(?m)^\s*\S+\s+$escapedFilter\s") {
              throw "FFmpeg asset '${{ matrix.asset }}' does not provide required filter '$filter'."
            }
          }

      - name: Generate a RecordSaaS smoke video
        shell: pwsh
        run: |
          & "${{ matrix.executable }}" -hide_banner -f lavfi -i testsrc=size=160x90:rate=10 -t 1 -pix_fmt yuv420p -y smoke.mp4
          if (!(Test-Path smoke.mp4)) {
            throw "smoke.mp4 was not created"
          }

      - name: Decode smoke video
        shell: pwsh
        run: |
          & "${{ matrix.executable }}" -hide_banner -i smoke.mp4 -f null -
